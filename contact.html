<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact page</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<a id="top"></a>

<header>
    <h1>Contact me</h1>
    <p class="page-description">Contact form
    </p>
    <p class="desktop-warning">Looks best on desktop or tablet!</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="now.html">Now</a>
        <a href="journey.html">My journey</a>
        <a href="portfolio.html">Portfolio</a>

        <span>Contact</span>
        <a href="contact-fr.html" style="font-style: italic">En français</a>
    </nav>

</header>

<section class="form-container">

    <form action="https://formserve.io/f/REDACTED" method="POST">
        <input type="hidden" name="form_type" value="English">

        <label for="name">Name</label>
        <div>
            <input type="text" id="name" name="name" required>
        </div>

        <label for="email">Email</label>
        <div>
            <input type="email" id="email" name="email" required>
        </div>

        <label for="message">Message</label>
        <div>
            <textarea id="message" name="message" rows="25" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

</section>

</body>
</html>
