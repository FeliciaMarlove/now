<html lang="en">

    <meta charset="UTF-8"/>

    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<a id="top"></a>

<header>
    <h1>Me contacter</h1>
    <p class="page-description">Formulaire de contact
    </p>
    <p class="desktop-warning">Ce site est optimisé pour les écrans d'ordinateurs ou tablettes</p>
    <nav>
        <a href="index-fr.html">Accueil</a>
        <a href="now-fr.html">En ce moment</a>

        <span>Contact</span>
        <a href="contact.html" style="font-style: italic">In English</a>
    </nav>

</header>

<section class="form-container">

    <form action="https://formserve.io/f/REDACTED" method="POST">
        <input type="hidden" name="form_type" value="français">

        <label for="name">Nom</label>
        <div class="field-container">
            <input type="text" id="name" name="name" required>
        </div>

        <label for="email">Email</label>
        <div>
            <input type="email" id="email" name="email" required>
        </div>

        <label for="message">Message</label>
        <div>
            <textarea id="message" name="message" rows="25" required></textarea>
        </div>

        <button type="submit">Envoyer</button>
    </form>

</section>

</body>
</html>
